name: Check for UniVPN Updates
on:
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight UTC
  workflow_dispatch: # Allow manual triggering

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get latest version from website
        id: get-web-version
        run: |
          PAGE_CONTENT=$(curl -s https://www.leagsoft.com/doc/article/103197.html)
          DOWNLOAD_LINK=$(echo "$PAGE_CONTENT" | grep -o "onClick=\"toPage('https://download.leagsoft.com/download/UniVPN/linux/univpn-linux-64-.*\\.zip', 'package')" | head -n 1)
          if [ -z "$DOWNLOAD_LINK" ]; then
            echo "No download link found on the page. Exiting."
            exit 0
          fi
          # Extract the full URL from the onClick attribute
          FULL_URL=$(echo "$DOWNLOAD_LINK" | sed -E "s/.*onClick=\"toPage\('([^']+)', 'package'\).*/\1/")
          echo "Found download URL: $FULL_URL"
          # Extract the version from the URL
          WEB_VERSION=$(echo "$FULL_URL" | sed -E 's/.*univpn-linux-64-([^.]+\.[^.]+\.[^.]+\.[^.]+)\.zip/\1/')
          echo "Latest web version: $WEB_VERSION"
          echo "WEB_VERSION=$WEB_VERSION" >> $GITHUB_OUTPUT

      - name: Get current version from Dockerfile
        id: get-local-version
        run: |
          LOCAL_VERSION=$(grep -oP 'ARG CLIENT_VERSION=\K.*' Dockerfile)
          echo "Current Dockerfile version: $LOCAL_VERSION"
          echo "LOCAL_VERSION=$LOCAL_VERSION" >> $GITHUB_OUTPUT

      - name: Compare versions and check arm64 availability
        id: compare-versions
        if: steps.get-web-version.outputs.WEB_VERSION != '' && steps.get-local-version.outputs.LOCAL_VERSION != ''
        run: |
          WEB_VERSION_ARRAY=($(echo ${{ steps.get-web-version.outputs.WEB_VERSION }} | tr '.' '\n'))
          LOCAL_VERSION_ARRAY=($(echo ${{ steps.get-local-version.outputs.LOCAL_VERSION }} | tr '.' '\n'))
          IS_NEWER=false

          # Compare version arrays
          for i in ${!WEB_VERSION_ARRAY[@]}; do
            if (( 10#${WEB_VERSION_ARRAY[i]} > 10#${LOCAL_VERSION_ARRAY[i]:-0} )); then
              IS_NEWER=true
              break
            elif (( 10#${WEB_VERSION_ARRAY[i]} < 10#${LOCAL_VERSION_ARRAY[i]:-0} )); then
              IS_NEWER=false
              break
            fi
          done

          if [ "$IS_NEWER" != true ]; then
            echo "Local version is already the latest or newer. Nothing to do."
            echo "SHOULD_UPDATE=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          WEB_VERSION="${{ steps.get-web-version.outputs.WEB_VERSION }}"

          # The Dockerfiles download installers directly at build time, so before bumping
          # CLIENT_VERSION, make sure the arm64 build actually exists for this version too
          # (otherwise an arm64 build would start failing with a 404 the moment this merges).
          ARM_URL="https://download.leagsoft.com/download/UniVPN/linuxarm/univpn-linuxarm-64-${WEB_VERSION}.zip"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L "$ARM_URL")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Error: ARM64 build not found at $ARM_URL (HTTP $HTTP_STATUS). Not bumping CLIENT_VERSION yet."
            echo "SHOULD_UPDATE=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "New version $WEB_VERSION is available for both architectures."
          echo "SHOULD_UPDATE=true" >> $GITHUB_OUTPUT

      - name: Update Dockerfiles, docker-compose.yml, and READMEs
        if: steps.compare-versions.outputs.SHOULD_UPDATE == 'true'
        run: |
          NEW_VERSION="${{ steps.get-web-version.outputs.WEB_VERSION }}"
          OLD_VERSION="${{ steps.get-local-version.outputs.LOCAL_VERSION }}"

          sed -i -E "s/ARG CLIENT_VERSION=.*/ARG CLIENT_VERSION=${NEW_VERSION}/" Dockerfile Dockerfile.cli
          sed -i -E "s/image: triatk\/univpn:.*/image: triatk\/univpn:${NEW_VERSION}/" docker-compose.yml

          for file in README.md README_zh.md; do
            sed -i "s/${OLD_VERSION}/${NEW_VERSION}/g" "$file"
          done

          echo "Bumped CLIENT_VERSION from $OLD_VERSION to $NEW_VERSION."

      - name: Commit and push version bump
        if: steps.compare-versions.outputs.SHOULD_UPDATE == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add Dockerfile Dockerfile.cli docker-compose.yml README.md README_zh.md
          git commit -m "chore: Bump UniVPN client version to ${{ steps.get-web-version.outputs.WEB_VERSION }}"
          git push
