name: Docker Build Check

on:
  push:
    branches: ["main", "cli-only-image"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    # Verifies both Dockerfiles still build on both platforms. This repo is maintained
    # for local builds only — nothing here pushes images anywhere.
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ["Dockerfile", "Dockerfile.cli"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          push: false
          platforms: linux/amd64,linux/arm64
          file: ${{ matrix.dockerfile }}
