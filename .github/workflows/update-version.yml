name: Update UniVPN Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version to update to (e.g., 1.2.3)'
        required: true
        type: string

jobs:
  update-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Update Dockerfiles and docker-compose.yml
        run: |
          VERSION="${{ github.event.inputs.version }}"
          sed -i -E "s/image: triatk\/univpn:.*/image: triatk\/univpn:${VERSION}/" docker-compose.yml
          sed -i -E "s/ARG CLIENT_VERSION=.*/ARG CLIENT_VERSION=${VERSION}/" Dockerfile Dockerfile.cli
          echo "Updated Dockerfile, Dockerfile.cli, and docker-compose.yml to version ${VERSION}"

      - name: Update README.md and README_zh.md with new version
        run: |
          # Detect the old version in the README files
          OLD_VERSION=$(grep -oP '\| Release[^\|]*\| \*\*\K[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(?=\*\*)' README.md)
          NEW_VERSION="${{ github.event.inputs.version }}"

          if [[ -z "$OLD_VERSION" || -z "$NEW_VERSION" ]]; then
              echo "Could not detect version numbers properly."
              exit 1
          fi

          # Replace all occurrences of OLD_VERSION with NEW_VERSION in both README files
          for file in README.md README_zh.md; do
            sed -i "s/${OLD_VERSION}/${NEW_VERSION}/g" "$file"
          done

          echo "Updated README.md and README_zh.md from version $OLD_VERSION to $NEW_VERSION."

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: Update UniVPN client to version ${{ github.event.inputs.version }}"
          title: "chore: Update UniVPN client to version ${{ github.event.inputs.version }}"
          body: |
            This PR updates the UniVPN client version in `docker-compose.yml`, `Dockerfile`, and `Dockerfile.cli` to `${{ github.event.inputs.version }}`.
            This is a manually triggered PR.
          branch: automated-version-update
          base: main
          delete-branch: true
